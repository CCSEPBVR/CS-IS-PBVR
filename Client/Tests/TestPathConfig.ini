[paths]
# This file centralizes machine-dependent paths used by Client/Tests.
# Use forward slashes on every OS. Relative paths are resolved from the repository root.
# You can use ${REPO_ROOT}, %REPO_ROOT%, {REPO_ROOT}, ${HOME}, or %USERPROFILE%.
#
# Environment variables still take precedence over this file.
# To use another file, set PBVR_TEST_PATH_CONFIG to its path.
#
# Windows example:
# SPX_VOLUME_DATA=C:/Users/user/work/SampleData/ucd/old/out/spx.pfl

# Client Test
SPX_VOLUME_DATA=
MEJ_VOLUME_DATA=
MEJ_TRANSFER_FUNCTION=
TORNADO_VOLUME_DATA=
HYDROGEN_VOLUME_DATA=
GT5D_VOLUME_DATA=
GT5D_TRANSFER_FUNCTION=
GT5D_TRANSFER_FUNCTION_EXPORT_TEST=
SPX_POINT_DATA=
CLOCK_POLYGON_DATA=

# Server Test
# Set to 1 when ServerTest data paths are on the remote server.
SERVER_TEST_REMOTE_DATA=0
ASCII_PFI_STRUCTURED_VOLUME_DATA=
BINARY_PFI_STRUCTURED_VOLUME_DATA=
ASCII_PFI_UNSTRUCTURED_VOLUME_DATA=
BINARY_PFI_UNSTRUCTURED_VOLUME_DATA=
VTI_VOLUME_DATA=
TETRA_AND_HEX_VOLUME_DATA=
UNSTRUCTURED_MULTI_BLOCK_VOLUME_DATA=
PVTU_VOLUME_DATA=
ENSIGHT_GOLD_VOLUME_DATA=
LARGE_VTI_VOLUME_DATA=
LARGE_TETRA_VOLUME_DATA=
LARGE_HEXA_VOLUME_DATA=
LARGE_PRISM_VOLUME_DATA=
LARGE_PYRAMID_VOLUME_DATA=
NETCDF_CF_VOLUME_DATA=
NETCDF_CAM_POINT_DATA=
NETCDF_CAM_CONNECT_DATA=
NETCDF_MPAS_VOLUME_DATA=
NETCDF_SLAC_MESH_DATA=
NETCDF_SLAC_MODE_DATA=

# Ensemble Test (EnsembleTransferFunctionTest / RepetitionLevelControlInSituTest / EnsembleInSituModeTest)
# サーバとアンサンブルシミュレーション(ens_Hydrogen_unstruct)は起動済みであること。空欄のキーは該当ステップを SKIP する。
ENSEMBLE_TF_EXPORT_TEST=
ENSEMBLE_TF_INVALID_JSON=
ENSEMBLE_TF_PARTIAL_JSON=
ENSEMBLE_TF_PARTIAL_RANGE_JSON=
ENSEMBLE_TF_ARRAY_JSON=
# サーバ側ファイル(default.json / history_XXXXX.json / 粒子ファイル)をローカルから読めるときだけ設定する。
ENSEMBLE_VIS_PARAM_DIR=
ENSEMBLE_PARTICLE_DIR=
# pbvr_server の標準エラー出力を保存したログファイル(S-IS-35 の警告行を確認する。任意)。
PBVR_SERVER_STDERR_LOG=

# Optional common overrides. Leave these commented unless you intentionally want one
# path to override every test that uses the same environment variable name.
# デフォルトで決まっているテスト結果のディレクトリ・レポート・スクリーンショットの出力先を上書きして変更することができる
# PBVR_TEST_OUTPUT_DIR=${REPO_ROOT}/Client/output-tests/manual
# PBVR_TEST_REPORT_DIR=${REPO_ROOT}/Client/output-tests/manual
# PBVR_SCREENSHOT_DIR=${REPO_ROOT}/Client/output-tests/manual/img
