[paths]
# This file centralizes machine-dependent paths used by Client/Tests.
# Use forward slashes on every OS. Relative paths are resolved from the repository root.
# You can use ${REPO_ROOT}, %REPO_ROOT%, {REPO_ROOT}, ${HOME}, or %USERPROFILE%.
#
# Environment variables still take precedence over this file.
# To use another file, set PBVR_TEST_PATH_CONFIG to its path.
#
# Windows example:
# SPX_VOLUME_DATA=C:/Users/user/work/SampleData/ucd/old/out/spx.pfl

SPX_VOLUME_DATA=
MEJ_VOLUME_DATA=
MEJ_TRANSFER_FUNCTION=
TORNADO_VOLUME_DATA=
HYDROGEN_VOLUME_DATA=
GT5D_VOLUME_DATA=
GT5D_TRANSFER_FUNCTION=
GT5D_TRANSFER_FUNCTION_EXPORT_TEST=
SPX_POINT_DATA=
CLOCK_POLYGON_DATA=

# Optional common overrides. Leave these commented unless you intentionally want one
# path to override every test that uses the same environment variable name.
# デフォルトで決まっているテスト結果のディレクトリ・レポート・スクリーンショットの出力先を上書きして変更することができる
# PBVR_TEST_OUTPUT_DIR=${REPO_ROOT}/Client/output-tests/manual
# PBVR_TEST_REPORT_DIR=${REPO_ROOT}/Client/output-tests/manual
# PBVR_SCREENSHOT_DIR=${REPO_ROOT}/Client/output-tests/manual/img
