# Merge only these tables into the MCP host's config.toml; preserve other settings.
# Replace every C:/path/to/CS-IS-PBVR with the actual absolute repository path.
[mcp_servers.pbvr]
command = "C:/path/to/CS-IS-PBVR/Client/MCP/.venv/Scripts/python.exe"
args = ["C:/path/to/CS-IS-PBVR/Client/MCP/server.py"]
cwd = "C:/path/to/CS-IS-PBVR/Client/MCP"
tool_timeout_sec = 180
enabled_tools = ["get_state"]

[mcp_servers.pbvr.env]
PBVR_CTRL_DIR = "C:/path/to/CS-IS-PBVR/Client/MCP/ctrl"
PBVR_MCP_TIMEOUT_SECONDS = "120"
